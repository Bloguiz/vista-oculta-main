<style>
:root{--cream:#fffbf5;--ivory:#f7f3ed;--sand:#ede6d9;--green:#1f5c4a;--dark:#14342a;--taupe:#a69080;--ink:#3a3a3a;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font:17px/1.7 var(--sans);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:0 auto;padding:0 1.25rem}.n{max-width:760px}
.lab{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:600}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--dark);line-height:1.15}
h1 em{color:var(--green)}
header{position:sticky;top:0;z-index:9;background:rgba(255,251,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--sand)}
header .w{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:.4rem;padding-bottom:.4rem}
header img{height:52px;width:auto}
nav{display:flex;gap:1.4rem;font-size:.95rem;font-weight:500;color:var(--dark)}
nav a:hover{color:var(--green)}
.btn{display:inline-block;background:var(--dark);color:var(--cream);padding:.9rem 1.8rem;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;transition:background .2s}
.btn:hover{background:var(--green)}
.hero{display:grid;grid-template-columns:1fr 1.15fr;gap:3rem;align-items:center;padding:3.5rem 0}
.hero h1{font-size:clamp(2.4rem,5vw,4rem);margin:.8rem 0 1rem;font-weight:300}
.hero p.d{max-width:430px;margin-bottom:1.6rem}
.hero .img{aspect-ratio:4/3;overflow:hidden;border-radius:6px;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)}
.hero .img img{width:100%;height:100%;object-fit:cover}
.sec{padding:4rem 0}.alt{background:var(--ivory)}
.sh{margin-bottom:2.2rem}.sh h2{font-size:clamp(2rem,4vw,2.8rem);margin:.4rem 0}.sh p{color:var(--taupe)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.6rem}
.card{background:#fefcf9;border:1px solid var(--sand);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(20,52,42,.09)}
.card .im{aspect-ratio:16/10;overflow:hidden;background:var(--ivory)}
